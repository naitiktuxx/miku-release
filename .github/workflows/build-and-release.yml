name: Build & Release Miku

on:
  repository_dispatch:
    types: [trigger-miku-build, trigger-moviebox-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Patched Miku APKM
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Android Build Tools & Megatools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zipalign \
            apksigner \
            curl \
            unzip \
            webp \
            megatools
          
          # Install Apktool v2.11.0
          sudo curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v2.11.0/apktool_2.11.0.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Clone MikuPatches Engine
        run: |
          git clone --depth 1 https://github.com/naitiktuxx/mikupatches.git .

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "[✓] Consistent debug.keystore restored successfully."
          else
            echo "[!] No custom keystore secret provided."
          fi

      - name: Auto-Fetch Base APK from config.json
        run: |
          mkdir -p input
          python3 -c '
          import json, subprocess, sys, os

          cfg_path = "patches/com.community.newroom/config.json"
          if not os.path.exists(cfg_path):
              print(f"[!] Config not found at {cfg_path}")
              sys.exit(1)

          with open(cfg_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          url = data.get("apkmirror_url", "").strip()
          print(f"[*] Detected Download URL: {url}")

          if "mega.nz" in url:
              print("[*] Downloading via megatools...")
              subprocess.run(f"megatools dl \"{url}\" --path input/", shell=True, check=True)
          elif url.startswith("http"):
              print("[*] Downloading via curl...")
              subprocess.run(f"curl -L -o input/base_app.apk \"{url}\"", shell=True, check=True)
          else:
              print("[!] No valid URL found in config.json")
              sys.exit(1)
          '
          ls -la input/

      - name: Run MikuPatches Build Engine (APKM Only)
        run: |
          python3 build.py -a com.community.newroom -y -O apkm
          ls -la dist/

      - name: Prepare Release Assets & Notes
        id: meta
        run: |
          python3 -c '
          import os, json, hashlib, shutil, glob

          # Find the output directory in dist/
          dist_dir = None
          for cand in ("dist/Miku", "dist/MovieBox"):
              if os.path.exists(cand):
                  dist_dir = cand
                  break

          if not dist_dir:
              subdirs = [os.path.join("dist", d) for d in os.listdir("dist") if os.path.isdir(os.path.join("dist", d))]
              dist_dir = subdirs[0] if subdirs else "dist"

          print(f"[*] Using output directory: {dist_dir}")

          # Read info.json if present
          version = "4.0.02"
          info_path = os.path.join(dist_dir, "info.json")
          if os.path.exists(info_path):
              try:
                  with open(info_path, "r", encoding="utf-8") as f:
                      info = json.load(f)
                      version = info.get("release_version", version)
              except Exception as e:
                  print(f"Warning reading info.json: {e}")

          run_num = os.environ.get("GITHUB_RUN_NUMBER", "1")
          tag_name = f"v{version}-{run_num}"

          # Read PATCHES.txt if present
          patches_txt = ""
          patches_file = os.path.join(dist_dir, "PATCHES.txt")
          if os.path.exists(patches_file):
              with open(patches_file, "r", encoding="utf-8") as pf:
                  patches_txt = pf.read()

          # Standardize APKM file naming to Miku-v<version>-<arch>.apkm (APKM only)
          os.makedirs("release_assets", exist_ok=True)
          asset_files = []
          for root, _, files in os.walk(dist_dir):
              for file in sorted(files):
                  if file.endswith(".apkm") and not file.startswith("base"):
                      src = os.path.join(root, file)
                      clean_name = file.replace("MovieBox", "Miku")
                      if not clean_name.startswith("Miku-"):
                          clean_name = f"Miku-{clean_name}"
                      dst = os.path.join("release_assets", clean_name)
                      shutil.copy2(src, dst)
                      asset_files.append(dst)

          if os.path.exists(patches_file):
              shutil.copy2(patches_file, "release_assets/PATCHES.txt")
          if os.path.exists(info_path):
              shutil.copy2(info_path, "release_assets/info.json")

          # Calculate SHA-256 Checksums
          checksum_lines = []
          for af in sorted(asset_files):
              fname = os.path.basename(af)
              sha = hashlib.sha256(open(af, "rb").read()).hexdigest()
              checksum_lines.append(f"- `{fname}`: `{sha}`")

          checksums_block = "\n".join(checksum_lines) if checksum_lines else "None"

          release_body = (
              f"## 🎬 Miku v{version} (Automated APKM Release)\n\n"
              "Clean, lightweight & ad-free streaming player built with **MikuPatches**.\n\n"
              "### 📦 Download Assets (APKMirror Bundles)\n"
              f"- **ARM64-v8a (64-bit)** (~62 MB): `Miku-v{version}-arm64-v8a.apkm`\n"
              f"- **ARMEABI-v7a (32-bit)** (~62 MB): `Miku-v{version}-armeabi-v7a.apkm`\n\n"
              f"### 🛡️ Checksums (SHA-256)\n{checksums_block}\n\n"
              "---\n\n"
              f"### 📝 Applied Patches & Features\n```text\n{patches_txt}\n```\n"
          )

          with open("RELEASE_BODY.md", "w", encoding="utf-8") as f:
              f.write(release_body)

          env_file = os.environ.get("GITHUB_ENV")
          if env_file:
              with open(env_file, "a", encoding="utf-8") as ef:
                  ef.write(f"RELEASE_TAG={tag_name}\n")
                  ef.write(f"RELEASE_TITLE=Miku v{version}\n")
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            release_assets/*.apkm
            release_assets/PATCHES.txt
            release_assets/info.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
